[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stage4-metric3d"
version = "0.5.1"
description = "World-grounded player pose for calibrated broadcast football replay"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
visual = ["matplotlib>=3.7"]
test = ["pytest>=7"]
all = ["matplotlib>=3.7", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stage4_metric3d*"]
